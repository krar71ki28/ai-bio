<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ذكائي المحلي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <div class="header">
    <a href="index.html">⬅️ القائمة</a>
    <b>🤖 ذكائي المحلي</b>
    <div id="status">جاري التحميل...</div>
  </div>
  <div class="chat" id="chatBox">
    <div class="msg ai">مرحباً! أنا جاهز للدردشة. (يحتاج إنترنت لأول مرة، ثم يعمل بدون إنترنت).</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب هنا..." disabled>
    <button id="sendBtn" disabled>إرسال</button>
  </div>
  <script type="module" src="js/chat.js"></script>
</body>
</html>
