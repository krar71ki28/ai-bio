<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quantum AI Evolution</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --accent: #fbbf24; --danger: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; line-height: 1.6; overflow-x: hidden; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(15, 23, 42, 0.9); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
  .logo { font-size: 20px; font-weight: 900; color: var(--primary); }
  .hero { text-align: center; padding: 30px 20px; background: radial-gradient(circle at center, rgba(56,189,248,0.1) 0%, transparent 70%); }
  .hero h1 { font-size: 28px; margin-bottom: 10px; font-weight: 900; }
  .hero h1 span { color: var(--primary); }
  .hero p { color: var(--text-muted); font-size: 14px; }
  .simulator-container { max-width: 900px; margin: 0 auto; padding: 0 15px; }
  .canvas-wrapper { position: relative; width: 100%; height: 55vh; min-height: 350px; background: #0b1120; border-radius: 20px; overflow: hidden; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  canvas { display: block; width: 100%; height: 100%; }
  
  .stats-bar { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; background: var(--card); border-radius: 16px; padding: 12px; margin-top: -20px; position: relative; z-index: 10; width: 95%; margin-left: auto; margin-right: auto; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
  .stat-item { text-align: center; }
  .stat-item span { display: block; font-size: 11px; color: var(--text-muted); }
  .stat-item b { font-size: 18px; color: var(--primary); font-weight: 900; }
  .stat-item .gold { color: var(--accent); }
  
  .personal-best { text-align: center; margin-top: 10px; font-size: 13px; color: #cbd5e1; background: rgba(56, 189, 248, 0.1); padding: 8px; border-radius: 12px; width: 95%; max-width: 900px; margin-left: auto; margin-right: auto; border: 1px solid rgba(56, 189, 248, 0.2); }

  .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 15px; margin-bottom: 20px; }
  .btn { padding: 10px 15px; border: none; border-radius: 10px; font-family: 'Cairo'; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: var(--primary); color: #000; }
  .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  .btn-accent { background: var(--accent); color: #000; }
  .btn-purple { background: #a78bfa; color: #000; }
  .btn-green { background: #10b981; color: #fff; }
  .btn-red { background: var(--danger); color: #fff; }
  
  footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px; }
  #fileInput { display: none; }

  @media (max-width: 768px) {
    .controls { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .btn { width: 100%; }
    .btn-share { grid-column: span 2; }
  }
</style>
</head>
<body>
<nav>
  <div class="logo">Quantum AI ⚛️</div>
</nav>
<header class="hero">
  <h1>الجيل القادم من <span>الذكاء الاصطناعي</span></h1>
  <p>شبكة عصبية عميقة + حساسات ليزر + بيئة متحركة</p>
</header>
<main class="simulator-container">
  <div class="canvas-wrapper">
    <canvas id="canvas"></canvas>
  </div>
  <div class="stats-bar">
    <div class="stat-item"><span>الجيل</span><b id="statGen">1</b></div>
    <div class="stat-item"><span>أحياء</span><b id="statAlive">50</b></div>
    <div class="stat-item"><span>أفضل لياقة</span><b class="gold" id="statBest">0</b></div>
    <div class="stat-item"><span>الرقم القياسي</span><b id="statRecord" style="color:#a78bfa;">1</b></div>
  </div>
  
  <div class="personal-best" id="personalBestBox" style="display:none;">
    🔥 رقمك القياسي: <b id="personalBestGen">1</b> جيل
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnSpeed">⏩ السرعة: x1</button>
    <button class="btn btn-secondary" id="btnPause">⏸️ إيقاف</button>
    <button class="btn btn-red" id="btnChampion" style="display:none;">🏆 عرض البطل</button>
    <button class="btn btn-accent" id="btnSaveBrain">💾 حفظ العقل</button>
    <button class="btn btn-purple" id="btnLoadBrain">📂 تحميل العقل</button>
    <button class="btn btn-secondary" id="btnReset">🔄 مسح</button>
  </div>
</main>

<footer>صُنع بـ ⚛️ | خوارزميات تطورية عميقة</footer>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  let targetX, targetY, startX, startY;
  let walls = [];
  const POP_SIZE = 50;
  const LIFESPAN = 300;
  let speedMultiplier = 1;
  let isPaused = false;
  let population = [];
  let currentGen = 1;
  let frameCount = 0;
  let bestFitnessEver = 0;
  let bestBrainEver = null;
  let championMode = false;
  let time = 0;
  let stagnationFrames = 0;
  let lastBestFitness = 0;
  let mutationRate = 0.1;
  let particles = [];

  // 8 مدخلات: dx, dy, vx, vy + 4 أشعة ليزر (يمين، يسار، أعلى، أسفل)
  const INPUTS = 8;
  const HIDDEN1 = 32;
  const HIDDEN2 = 16;
  const OUTPUTS = 2;

  let personalBestGen = parseInt(localStorage.getItem('quantum_ai_best_gen')) || 1;

  // دالة إطلاق الليزر (Raycasting) لحساب المسافة للجدار
  function castRay(x, y, angle, maxDist) {
    let dx = Math.cos(angle);
    let dy = Math.sin(angle);
    let dist = maxDist;
    for (let w of walls) {
      let tmin = (w.x - x) / dx;
      let tmax = (w.x + w.w - x) / dx;
      if (tmin > tmax) { let tmp = tmin; tmin = tmax; tmax = tmp; }
      let tymin = (w.y - y) / dy;
      let tymax = (w.y + w.h - y) / dy;
      if (tymin > tymax) { let tmp = tymin; tymin = tymax; tymax = tmp; }
      if ((tmin > tymax) || (tymin > tmax)) continue;
      if (tymin > tmin) tmin = tymin;
      if (tymax < tmax) tmax = tymax;
      if (tmin < dist && tmin > 0) dist = tmin;
    }
    // ارتداد عن حواف الشاشة
    if (dx > 0) dist = Math.min(dist, (width - x) / dx);
    if (dx < 0) dist = Math.min(dist, (0 - x) / dx);
    if (dy > 0) dist = Math.min(dist, (height - y) / dy);
    if (dy < 0) dist = Math.min(dist, (0 - y) / dy);
    return dist;
  }

  class NeuralNetwork {
    constructor(w1, b1, w2, b2, w3, b3) {
      this.w1 = w1 || Array.from({length: HIDDEN1}, () => Array.from({length: INPUTS}, () => (Math.random() * 2 - 1)));
      this.b1 = b1 || Array.from({length: HIDDEN1}, () => (Math.random() * 2 - 1));
      this.w2 = w2 || Array.from({length: HIDDEN2}, () => Array.from({length: HIDDEN1}, () => (Math.random() * 2 - 1)));
      this.b2 = b2 || Array.from({length: HIDDEN2}, () => (Math.random() * 2 - 1));
      this.w3 = w3 || Array.from({length: OUTPUTS}, () => Array.from({length: HIDDEN2}, () => (Math.random() * 2 - 1)));
      this.b3 = b3 || Array.from({length: OUTPUTS}, () => (Math.random() * 2 - 1));
    }
    
    predict(inputs) {
      let h1 = [];
      for (let i = 0; i < HIDDEN1; i++) {
        let sum = this.b1[i];
        for (let j = 0; j < INPUTS; j++) sum += inputs[j] * this.w1[i][j];
        h1.push(Math.tanh(sum));
      }
      let h2 = [];
      for (let i = 0; i < HIDDEN2; i++) {
        let sum = this.b2[i];
        for (let j = 0; j < HIDDEN1; j++) sum += h1[j] * this.w2[i][j];
        h2.push(Math.tanh(sum));
      }
      let out = [];
      for (let i = 0; i < OUTPUTS; i++) {
        let sum = this.b3[i];
        for (let j = 0; j < HIDDEN2; j++) sum += h2[j] * this.w3[i][j];
        out.push(Math.tanh(sum));
      }
      return out;
    }
    
    crossover(other) {
      let cw = (w) => w.map((row, i) => row.map((val, j) => Math.random() > 0.5 ? val : other[i][j]));
      let cb = (b, o) => b.map((val, i) => Math.random() > 0.5 ? val : o[i]);
      return new NeuralNetwork(
        cw(this.w1).map((r, i) => r.map((v, j) => Math.random() > 0.5 ? v : other.w1[i][j])), cb(this.b1, other.b1),
        cw(this.w2).map((r, i) => r.map((v, j) => Math.random() > 0.5 ? v : other.w2[i][j])), cb(this.b2, other.b2),
        cw(this.w3).map((r, i) => r.map((v, j) => Math.random() > 0.5 ? v : other.w3[i][j])), cb(this.b3, other.b3)
      );
    }
    
    mutate(rate) {
      const mut = (v) => (Math.random() < rate) ? Math.max(-1, Math.min(1, v + (Math.random() * 2 - 1) * 0.5)) : v;
      this.w1 = this.w1.map(row => row.map(mut));
      this.b1 = this.b1.map(mut);
      this.w2 = this.w2.map(row => row.map(mut));
      this.b2 = this.b2.map(mut);
      this.w3 = this.w3.map(row => row.map(mut));
      this.b3 = this.b3.map(mut);
    }
  }

  class Agent {
    constructor(brain) {
      this.brain = brain || new NeuralNetwork();
      this.x = startX + (Math.random() - 0.5) * 20;
      this.y = startY + (Math.random() - 0.5) * 20;
      this.vx = 0; this.vy = 0;
      this.dead = false; this.reached = false;
      this.fitness = 0; this.trail = [];
      this.lidarRays = [];
    }
    
    update() {
      if (this.dead) return;
      
      let dx = targetX - this.x;
      let dy = targetY - this.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      
      // إطلاق 4 أشعة ليزر
      let r1 = castRay(this.x, this.y, 0, 300); // يمين
      let r2 = castRay(this.x, this.y, Math.PI, 300); // يسار
      let r3 = castRay(this.x, this.y, Math.PI/2, 300); // أسفل
      let r4 = castRay(this.x, this.y, -Math.PI/2, 300); // أعلى
      
      this.lidarRays = [
        {x: this.x + r1, y: this.y},
        {x: this.x - r2, y: this.y},
        {x: this.x, y: this.y + r3},
        {x: this.x, y: this.y - r4}
      ];
      
      // المدخلات للشبكة (مُطبعة بين -1 و 1)
      let inputs = [
        dx / width, dy / height, 
        this.vx / 5, this.vy / 5,
        r1 / 300, r2 / 300, r3 / 300, r4 / 300
      ];
      
      let out = this.brain.predict(inputs);
      
      this.vx += out[0] * 0.8;
      this.vy += out[1] * 0.8;
      
      let speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 7) { this.vx = (this.vx / speed) * 7; this.vy = (this.vy / speed) * 7; }
      
      this.x += this.vx; this.y += this.vy;
      this.trail.push({x: this.x, y: this.y});
      if (this.trail.length > 20) this.trail.shift();
      
      this.fitness = 1000 / (dist + 1);
      
      // اصطدام
      for (let w of walls) {
        if (this.x > w.x && this.x < w.x + w.w && this.y > w.y && this.y < w.y + w.h) this.dead = true;
      }
      if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.dead = true;
      
      if (dist < 30) { 
        this.reached = true; 
        this.dead = true; 
        this.fitness += 5000;
        // تأثير الانفجار
        if (championMode || speedMultiplier === 1) {
          for(let i=0; i<10; i++) {
            particles.push({
              x: this.x, y: this.y,
              vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
              life: 1, color: '#fbbf24'
            });
          }
        }
      }
    }
  }

  function loadSavedState() {
    const saved = localStorage.getItem('quantum_ai_brain');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        if (data.w1 && data.w1.length === HIDDEN1 && data.w1[0].length === INPUTS) {
          bestBrainEver = new NeuralNetwork(data.w1, data.b1, data.w2, data.b2, data.w3, data.b3);
          bestFitnessEver = data.fitness || 10000;
          currentGen = data.gen || 1;
        }
      } catch(e) {}
    }
    if (personalBestGen > 1) {
      document.getElementById('personalBestBox').style.display = 'block';
      document.getElementById('personalBestGen').innerText = personalBestGen;
      document.getElementById('statRecord').innerText = personalBestGen;
    }
  }

  function initPopulation() {
    population = [];
    for (let i = 0; i < POP_SIZE; i++) population.push(new Agent(i === 0 && bestBrainEver ? bestBrainEver : null));
    frameCount = 0;
  }

  function nextGeneration() {
    population.sort((a, b) => b.fitness - a.fitness);
    
    if (population[0].fitness > bestFitnessEver) {
      bestFitnessEver = population[0].fitness;
      bestBrainEver = population[0].brain;
      // حفظ تلقائي
      const dataToSave = { 
        gen: currentGen, fitness: bestFitnessEver, 
        w1: bestBrainEver.w1, b1: bestBrainEver.b1, 
        w2: bestBrainEver.w2, b2: bestBrainEver.b2,
        w3: bestBrainEver.w3, b3: bestBrainEver.b3
      };
      localStorage.setItem('quantum_ai_brain', JSON.stringify(dataToSave));
    }
    
    if (currentGen > personalBestGen) {
      personalBestGen = currentGen;
      localStorage.setItem('quantum_ai_best_gen', personalBestGen);
      document.getElementById('statRecord').innerText = personalBestGen;
      document.getElementById('personalBestBox').style.display = 'block';
      document.getElementById('personalBestGen').innerText = personalBestGen;
    }

    let newPop = [];
    newPop.push(new Agent(bestBrainEver)); // النخبة
    
    for (let i = 1; i < POP_SIZE; i++) {
      let p1 = population[Math.floor(Math.random() * 20)]; // اختيار أفضل 20
      let p2 = population[Math.floor(Math.random() * 20)];
      let childBrain = p1.brain.crossover(p2.brain);
      childBrain.mutate(mutationRate);
      newPop.push(new Agent(childBrain));
    }
    
    population = newPop;
    currentGen++;
    frameCount = 0;
    stagnationFrames = 0;
    lastBestFitness = 0;
    
    // الطفرة التكيفية: إذا لم يتحسن الأداء، نزيد الطفرة
    if (currentGen % 10 === 0) {
      mutationRate = Math.min(0.5, mutationRate + 0.05);
    } else {
      mutationRate = Math.max(0.05, mutationRate - 0.01);
    }

    document.getElementById('statGen').innerText = currentGen;
    document.getElementById('statBest').innerText = Math.floor(bestFitnessEver);
    
    if (currentGen > 10) document.getElementById('btnChampion').style.display = 'flex';
  }

  function update() {
    if (isPaused) return;
    
    time += 0.02;
    // الهدف يتحرك في مسار دائري
    targetX = width/2 + Math.sin(time * 0.8) * (width * 0.35);
    targetY = height/2 + Math.cos(time * 1.2) * (height * 0.3);
    
    // الجدران تتحرك صعوداً وهبوطاً (تحدي إضافي)
    let wallOffset = Math.sin(time * 1.5) * (height * 0.15);
    walls[0].y = -height/2 + wallOffset;
    walls[1].y = height/2 + wallOffset;

    for (let s = 0; s < speedMultiplier; s++) {
      let aliveCount = 0;
      for (let agent of population) if (!agent.dead) { agent.update(); aliveCount++; }
      frameCount++;
      
      // نظام القتل الرحيم
      if (!championMode) {
        if (population[0].fitness > lastBestFitness) {
          lastBestFitness = population[0].fitness;
          stagnationFrames = 0;
        } else {
          stagnationFrames++;
        }
      }
      
      if (championMode && aliveCount === 0) {
        population[0].dead = false;
        population[0].x = startX;
        population[0].y = startY;
        aliveCount = 1;
      }
      
      if (!championMode && (aliveCount === 0 || frameCount >= LIFESPAN || stagnationFrames > 60)) { 
        nextGeneration(); 
        break; 
      }
      document.getElementById('statAlive').innerText = aliveCount;
    }
    
    // تحديث الجزيئات
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.life -= 0.02;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw() {
    ctx.fillStyle = 'rgba(11, 17, 32, 0.4)';
    ctx.fillRect(0, 0, width, height);
    
    // رسم الجدران
    ctx.fillStyle = '#334155';
    for (let w of walls) {
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x, w.y, w.w, w.h);
    }
    
    // رسم الهدف
    ctx.beginPath();
    ctx.arc(targetX, targetY, 20, 0, Math.PI*2);
    ctx.fillStyle = '#fbbf24';
    ctx.fill();
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#fbbf24';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // رسم الجزيئات
    for (let p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
      ctx.fillStyle = `rgba(251, 191, 36, ${p.life})`;
      ctx.fill();
    }
    
    // رسم الكائنات
    for (let agent of population) {
      if (agent.dead) continue;
      let isLeader = (population[0] === agent && !agent.dead);
      
      if (agent.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(agent.trail[0].x, agent.trail[0].y);
        for (let i = 1; i < agent.trail.length; i++) ctx.lineTo(agent.trail[i].x, agent.trail[i].y);
        ctx.strokeStyle = isLeader ? 'rgba(56, 189, 248, 0.8)' : 'rgba(148, 163, 184, 0.1)';
        ctx.lineWidth = isLeader ? 3 : 1;
        ctx.stroke();
      }
      
      // رسم أشعة الليزر للبطل فقط
      if (isLeader && championMode) {
        ctx.beginPath();
        for (let r of agent.lidarRays) {
          ctx.moveTo(agent.x, agent.y);
          ctx.lineTo(r.x, r.y);
        }
        ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      
      ctx.beginPath();
      ctx.arc(agent.x, agent.y, isLeader ? 8 : 3, 0, Math.PI*2);
      ctx.fillStyle = isLeader ? '#38bdf8' : '#64748b';
      ctx.fill();
      if (isLeader) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    }
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    width = canvas.clientWidth; height = canvas.clientHeight;
    canvas.width = width * dpr; canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    startX = width * 0.1; startY = height * 0.5;
    let wallThickness = width * 0.05;
    let gap = height * 0.3;
    walls = [
      { x: width/2 - wallThickness/2, y: -height/2, w: wallThickness, h: height/2 + gap/2 },
      { x: width/2 - wallThickness/2, y: height - gap/2, w: wallThickness, h: height/2 }
    ];
  }
  window.addEventListener('resize', resize); resize();

  document.getElementById('btnSpeed').addEventListener('click', (e) => {
    if (speedMultiplier === 1) { speedMultiplier = 10; e.target.innerText = '⏩ السرعة: x10'; }
    else if (speedMultiplier === 10) { speedMultiplier = 100; e.target.innerText = '⚡ السرعة: x100'; }
    else if (speedMultiplier === 100) { speedMultiplier = 1000; e.target.innerText = '🔥 السرعة: x1000'; }
    else if (speedMultiplier === 1000) { speedMultiplier = 5000; e.target.innerText = '☄️ السرعة: x5000'; }
    else { speedMultiplier = 1; e.target.innerText = '⏩ السرعة: x1'; }
  });

  document.getElementById('btnPause').addEventListener('click', (e) => {
    isPaused = !isPaused;
    e.target.innerText = isPaused ? '▶️ متابعة' : '⏸️ إيقاف';
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    if(!confirm('هل أنت متأكد من مسح كل التقدم؟')) return;
    currentGen = 1; bestFitnessEver = 0; bestBrainEver = null;
    championMode = false; mutationRate = 0.1;
    localStorage.removeItem('quantum_ai_brain');
    localStorage.removeItem('quantum_ai_best_gen');
    personalBestGen = 1;
    document.getElementById('statGen').innerText = currentGen;
    document.getElementById('statBest').innerText = '0';
    document.getElementById('personalBestBox').style.display = 'none';
    document.getElementById('statRecord').innerText = '1';
    document.getElementById('btnChampion').style.display = 'none';
    initPopulation();
  });

  document.getElementById('btnChampion').addEventListener('click', () => {
    championMode = !championMode;
    if (championMode) {
      population = [new Agent(bestBrainEver)];
      document.getElementById('btnChampion').innerText = '👥 عرض الجميع';
      document.getElementById('btnChampion').classList.add('btn-primary');
      document.getElementById('btnChampion').classList.remove('btn-red');
    } else {
      document.getElementById('btnChampion').innerText = '🏆 عرض البطل';
      document.getElementById('btnChampion').classList.add('btn-red');
      document.getElementById('btnChampion').classList.remove('btn-primary');
      initPopulation();
    }
  });

  document.getElementById('btnSaveBrain').addEventListener('click', () => {
    if (!bestBrainEver) return alert('لم يتم تطوير عقل بعد!');
    const data = { gen: currentGen, w1: bestBrainEver.w1, b1: bestBrainEver.b1, w2: bestBrainEver.w2, b2: bestBrainEver.b2, w3: bestBrainEver.w3, b3: bestBrainEver.b3 };
    const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `quantum_brain_gen_${currentGen}.json`;
    a.click(); URL.revokeObjectURL(url);
  });

  document.getElementById('btnLoadBrain').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const data = JSON.parse(event.target.result);
        if (!data.w1 || data.w1.length !== HIDDEN1) return alert('عقل غير متوافق!');
        bestBrainEver = new NeuralNetwork(data.w1, data.b1, data.w2, data.b2, data.w3, data.b3);
        bestFitnessEver = 10000;
        currentGen = data.gen || 1;
        document.getElementById('statGen').innerText = currentGen;
        document.getElementById('statBest').innerText = '10000+';
        championMode = false;
        initPopulation();
        alert('تم تحميل العقل بنجاح!');
      } catch (err) { alert('خطأ في قراءة الملف!'); }
    };
    reader.readAsText(file);
  });

  loadSavedState();
  initPopulation();
  loop();
</script>
</body>
</html>
