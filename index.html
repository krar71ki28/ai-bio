<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Robot Evolution V2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; overflow: hidden; background: #09090b; font-family: 'Cairo', sans-serif; color: #fff; touch-action: none; }
  #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .panel { background: rgba(15, 23, 42, 0.8); padding: 10px 15px; border-radius: 12px; border: 1px solid #38bdf8; font-size: 13px; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .panel b { color: #38bdf8; font-size: 15px; }
  #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  button { padding: 10px 18px; border-radius: 10px; border: none; font-family: 'Cairo'; font-weight: bold; font-size: 13px; background: #38bdf8; color: #000; cursor: pointer; transition: 0.2s; }
  button:active { transform: scale(0.95); }
  button.reset { background: #ef4444; color: #fff; }
</style>
</head>
<body>
  <div id="ui">
    <div class="panel">الجيل: <b id="genText">1</b></div>
    <div class="panel">أفضل مسافة: <b id="fitText">0</b>م</div>
  </div>
  <div id="controls">
    <button id="btnSpeed">⏩ السرعة: x1</button>
    <button class="reset" id="btnReset">🔄 إعادة</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(8, 5, -12);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const groundGeo = new THREE.PlaneGeometry(500, 500);
    const groundMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    scene.add(groundMesh);

    const gridHelper = new THREE.GridHelper(500, 250, 0x38bdf8, 0x334155);
    scene.add(gridHelper);

    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);
    world.solver.iterations = 5; 

    const groundBody = new CANNON.Body({ mass: 0 });
    groundBody.addShape(new CANNON.Plane());
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    // الشبكة العصبية المطورة (10 مدخلات -> 8 مخفية -> 4 مخرجات)
    class NeuralNet {
      constructor() {
        this.w1 = Array.from({length: 10}, () => Array.from({length: 10}, () => Math.random() * 2 - 1));
        this.w2 = Array.from({length: 4}, () => Array.from({length: 10}, () => Math.random() * 2 - 1));
      }
      predict(inputs) {
        let hidden = [];
        for (let i = 0; i < 10; i++) {
          let sum = 0;
          for (let j = 0; j < 10; j++) sum += inputs[j] * this.w1[i][j];
          hidden.push(Math.tanh(sum));
        }
        let out = [];
        for (let i = 0; i < 4; i++) {
          let sum = 0;
          for (let j = 0; j < 10; j++) sum += hidden[j] * this.w2[i][j];
          out.push(Math.tanh(sum));
        }
        return out;
      }
      mutate() {
        const mut = (v) => Math.random() < 0.1 ? v + (Math.random() * 2 - 1) * 0.5 : v;
        this.w1 = this.w1.map(r => r.map(mut));
        this.w2 = this.w2.map(r => r.map(mut));
      }
    }

    class Robot {
      constructor(brain) {
        this.brain = brain || new NeuralNet();
        this.parts = [];
        this.meshes = [];
        this.constraints = [];
        this.time = 0; // ساعة داخلية لإيقاع المشي
        
        const createPart = (w, h, d, mass, x, y, z, color) => {
          const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
          const body = new CANNON.Body({ mass: mass, shape: shape });
          body.position.set(x, y, z);
          world.addBody(body);
          const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(w, h, d),
            new THREE.MeshLambertMaterial({ color: color })
          );
          scene.add(mesh);
          this.parts.push(body);
          this.meshes.push(mesh);
          return body;
        };

        // جذع أخف قليلاً لسهولة التوازن
        this.torso = createPart(1, 1.5, 0.5, 8, 0, 3, 0, 0x38bdf8); 
        this.lThigh = createPart(0.3, 1, 0.3, 2, -0.3, 1.8, 0, 0xa78bfa);
        this.lCalf = createPart(0.3, 1, 0.3, 1, -0.3, 0.8, 0, 0x38bdf8);
        this.rThigh = createPart(0.3, 1, 0.3, 2, 0.3, 1.8, 0, 0xa78bfa);
        this.rCalf = createPart(0.3, 1, 0.3, 1, 0.3, 0.8, 0, 0x38bdf8);

        const createJoint = (bodyA, bodyB, pivotA, pivotB) => {
          const joint = new CANNON.HingeConstraint(bodyA, bodyB, {
            pivotA: new CANNON.Vec3(...pivotA), pivotB: new CANNON.Vec3(...pivotB),
            axisA: new CANNON.Vec3(1, 0, 0), axisB: new CANNON.Vec3(1, 0, 0)
          });
          world.addConstraint(joint);
          joint.enableMotor();
          joint.setMotorMaxForce(80); // قوة محرك أعلى
          this.constraints.push(joint);
        };

        createJoint(this.torso, this.lThigh, [-0.3, -0.75, 0], [0, 0.5, 0]);
        createJoint(this.lThigh, this.lCalf, [0, -0.5, 0], [0, 0.5, 0]);
        createJoint(this.torso, this.rThigh, [0.3, -0.75, 0], [0, 0.5, 0]);
        createJoint(this.rThigh, this.rCalf, [0, -0.5, 0], [0, 0.5, 0]);

        this.dead = false;
        this.life = 0;
        this.fitness = 0;
      }
      
      update() {
        if (this.dead) return;
        this.life++;
        this.time += 0.1; // تقدم الساعة
        
        let tPos = this.torso.position;
        let tVel = this.torso.velocity;
        
        // المدخلات (10): السرعة، التوازن، زوايا المفاصل + الساعة الداخلية (sin, cos)
        let inputs = [
          tVel.z / 5, tVel.y / 5, this.torso.angularVelocity.x / 5,
          this.lThigh.angularVelocity.x / 5, this.lCalf.angularVelocity.x / 5,
          this.rThigh.angularVelocity.x / 5, this.rCalf.angularVelocity.x / 5,
          1, // Bias
          Math.sin(this.time), // موجة الجيب (للمشي)
          Math.cos(this.time)  // موجة الجيب
        ];
        
        let out = this.brain.predict(inputs);
        
        this.constraints[0].setMotorSpeed(out[0] * 15);
        this.constraints[1].setMotorSpeed(out[1] * 15);
        this.constraints[2].setMotorSpeed(out[2] * 15);
        this.constraints[3].setMotorSpeed(out[3] * 15);
        
        for (let i = 0; i < this.parts.length; i++) {
          this.meshes[i].position.copy(this.parts[i].position);
          this.meshes[i].quaternion.copy(this.parts[i].quaternion);
        }
        
        // 🌟 دالة اللياقة الجديدة:
        // المسافة (z) + عقاب شديد إذا نزل الجذع (y)
        let distScore = tPos.z;
        let heightPenalty = tPos.y < 2.0 ? -10 : 0; // عقاب إذا سقط الجذع
        this.fitness = distScore + heightPenalty;
        
        if (tPos.y < 1.2 || this.life > 500) {
          this.dead = true;
          this.meshes.forEach(m => m.visible = false);
        }
      }

      destroy() {
        this.parts.forEach(p => world.removeBody(p));
        this.constraints.forEach(c => world.removeConstraint(c));
        this.meshes.forEach(m => scene.remove(m));
      }
    }

    const POP_SIZE = 5;
    let robots = [];
    let bestBrain = null;
    let bestFitness = -100;
    let gen = 1;
    let speed = 1;
    let maxZReached = 0;

    function init() {
      robots.forEach(r => r.destroy());
      robots = [];
      for (let i = 0; i < POP_SIZE; i++) robots.push(new Robot(bestBrain));
      gen = 1;
      maxZReached = 0;
      document.getElementById('genText').innerText = gen;
      camera.position.set(8, 5, -12);
    }

    function animate() {
      requestAnimationFrame(animate);
      
      let safeSpeed = Math.min(speed, 5);

      for (let s = 0; s < safeSpeed; s++) {
        world.step(1/60);
        
        let aliveCount = 0;
        let currentMaxZ = 0;

        for (let i = 0; i < robots.length; i++) {
          robots[i].update();
          if (!robots[i].dead) {
            aliveCount++;
            if (robots[i].torso.position.z > currentMaxZ) currentMaxZ = robots[i].torso.position.z;
          }
        }
        
        if (currentMaxZ > maxZReached) maxZReached = currentMaxZ;

        if (aliveCount === 0) {
          robots.sort((a, b) => b.fitness - a.fitness);
          if (robots[0].fitness > bestFitness) {
            bestFitness = robots[0].fitness;
            bestBrain = robots[0].brain;
          }
          
          let newBrains = [];
          for (let i = 0; i < POP_SIZE; i++) {
            let b = new NeuralNet();
            if (bestBrain) {
              b.w1 = JSON.parse(JSON.stringify(bestBrain.w1));
              b.w2 = JSON.parse(JSON.stringify(bestBrain.w2));
            }
            b.mutate();
            newBrains.push(b);
          }
          
          robots.forEach(r => r.destroy());
          robots = [];
          newBrains.forEach(b => robots.push(new Robot(b)));
          
          gen++;
          document.getElementById('genText').innerText = gen;
          document.getElementById('fitText').innerText = Math.max(0, bestFitness).toFixed(1);
          maxZReached = 0;
          break;
        }
      }
      
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, maxZReached - 10, 0.05);
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, 5, 0.05);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 4, 0.05);
      camera.lookAt(0, 2, maxZReached + 2);
      
      renderer.render(scene, camera);
    }

    document.getElementById('btnSpeed').onclick = (e) => {
      speed = speed === 1 ? 3 : (speed === 3 ? 5 : 1);
      e.target.innerText = '⏩ السرعة: x' + speed;
    };
    
    document.getElementById('btnReset').onclick = () => { bestBrain = null; bestFitness = -100; init(); };

    init();
    animate();
  </script>
</body>
</html>
