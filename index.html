<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Image Generator Pro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --primary: #a855f7; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; background-image: radial-gradient(circle at top, rgba(168, 85, 247, 0.15) 0%, transparent 50%); }
  
  .header { text-align: center; margin-bottom: 25px; }
  .header h1 { font-size: 32px; background: linear-gradient(to right, #a855f7, #38bdf8); -webkit-background-clip: text; color: transparent; margin-bottom: 10px; font-weight: 900; }
  .header p { color: #94a3b8; font-size: 14px; }

  .generator-box { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px; width: 100%; max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  
  .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
  textarea { width: 100%; padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff; font-family: 'Cairo'; font-size: 15px; resize: none; height: 90px; outline: none; transition: 0.3s; }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }

  .style-selector { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
  .style-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; font-family: 'Cairo'; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
  .style-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .generate-btn { width: 100%; padding: 16px; border-radius: 16px; border: none; background: linear-gradient(135deg, #a855f7, #38bdf8); color: #fff; font-family: 'Cairo'; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
  .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(168, 85, 247, 0.4); }
  .generate-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  .image-container { margin-top: 25px; width: 100%; max-width: 600px; border-radius: 24px; overflow: hidden; display: none; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1); }
  .image-container img { width: 100%; height: auto; display: block; }
  .download-btn { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px 15px; border-radius: 20px; text-decoration: none; font-size: 14px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; }
  .download-btn:hover { background: var(--primary); }

  .loader { display: none; flex-direction: column; align-items: center; margin-top: 30px; }
  .spinner { width: 50px; height: 50px; border: 5px solid rgba(168, 85, 247, 0.3); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* سجل الصور */
  .history-section { width: 100%; max-width: 600px; margin-top: 40px; }
  .history-title { font-size: 18px; color: #94a3b8; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
  .history-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .history-img { width: 100%; border-radius: 12px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.1); }
  .history-img:hover { transform: scale(1.05); }
</style>
</head>
<body>

  <div class="header">
    <h1>🎨 مولّد الصور الخارق</h1>
    <p>اكتب ما تتخيله، وسأرسمه لك في ثوانٍ (آمن على هاتفك)</p>
  </div>

  <div class="generator-box">
    <div class="input-group">
      <textarea id="promptInput" placeholder="مثال: قطة رائد فضاء تركب حصاناً في الفضاء، ألوان نيون، جودة عالية..."></textarea>
      
      <div class="style-selector">
        <button class="style-btn active" onclick="setStyle('realistic')">📷 واقعي</button>
        <button class="style-btn" onclick="setStyle('anime')">🌸 أنمي</button>
        <button class="style-btn" onclick="setStyle('cyberpunk')">🌃 سايبربانك</button>
        <button class="style-btn" onclick="setStyle('3d')">🧊 ثلاثي الأبعاد</button>
      </div>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateImage()">
      ✨ توليد الصورة
    </button>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>الذكاء الاصطناعي يرسم الآن...</p>
  </div>

  <div class="image-container" id="imageContainer">
    <img id="resultImage" src="" alt="AI Generated Image">
    <a id="downloadBtn" class="download-btn" download="ai_image.jpg">⬇️ تحميل</a>
  </div>

  <!-- سجل الصور السابقة -->
  <div class="history-section" id="historySection" style="display: none;">
    <div class="history-title">📸 صورك السابقة</div>
    <div class="history-grid" id="historyGrid"></div>
  </div>

  <script>
    let currentStyle = 'realistic';

    // استرجاع الصور المحفوظة من ذاكرة الهاتف عند فتح الصفحة
    window.onload = () => {
      const savedImages = JSON.parse(localStorage.getItem('ai_images') || '[]');
      if (savedImages.length > 0) {
        document.getElementById('historySection').style.display = 'block';
        renderHistory(savedImages);
      }
    };

    function setStyle(style) {
      currentStyle = style;
      document.querySelectorAll('.style-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    async function generateImage() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) return alert('الرجاء كتابة وصف للصورة أولاً!');

      const btn = document.getElementById('generateBtn');
      const loader = document.getElementById('loader');
      const imgContainer = document.getElementById('imageContainer');
      const img = document.getElementById('resultImage');
      const downloadBtn = document.getElementById('downloadBtn');

      imgContainer.style.display = 'none';
      loader.style.display = 'flex';
      btn.disabled = true;
      btn.innerHTML = 'جاري التوليد...';

      let stylePrompt = '';
      if (currentStyle === 'anime') stylePrompt = ', anime style, studio ghibli, highly detailed';
      if (currentStyle === 'cyberpunk') stylePrompt = ', cyberpunk, neon lights, futuristic, 8k';
      if (currentStyle === '3d') stylePrompt = ', 3d render, octane render, unreal engine 5, highly detailed';
      if (currentStyle === 'realistic') stylePrompt = ', photorealistic, 8k, highly detailed, cinematic lighting';

      const finalPrompt = prompt + stylePrompt;
      
      // استخدام خادم آمن وموثوق
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 1000000)}`;

      img.onload = () => {
        loader.style.display = 'none';
        imgContainer.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '✨ توليد صورة أخرى';
        downloadBtn.href = imageUrl;

        // حفظ الصورة في السجل المحلي
        saveToHistory(imageUrl, prompt);
      };

      img.onerror = () => {
        loader.style.display = 'none';
        btn.disabled = false;
        btn.innerHTML = '✨ حاول مرة أخرى';
        alert('حدث خطأ أثناء الاتصال بالخادم. تأكد من الإنترنت.');
      };

      img.src = imageUrl;
    }

    // دالة حفظ الصورة في ذاكرة الهاتف
    function saveToHistory(url, prompt) {
      let images = JSON.parse(localStorage.getItem('ai_images') || '[]');
      images.unshift({ url, prompt }); // إضافة الصورة الجديدة في البداية
      if (images.length > 6) images.pop(); // الاحتفاظ بآخر 6 صور فقط
      localStorage.setItem('ai_images', JSON.stringify(images));
      
      document.getElementById('historySection').style.display = 'block';
      renderHistory(images);
    }

    // دالة عرض السجل
    function renderHistory(images) {
      const grid = document.getElementById('historyGrid');
      grid.innerHTML = '';
      images.forEach(imgData => {
        const img = document.createElement('img');
        img.src = imgData.url;
        img.className = 'history-img';
        img.title = imgData.prompt;
        img.onclick = () => {
          document.getElementById('resultImage').src = imgData.url;
          document.getElementById('downloadBtn').href = imgData.url;
          document.getElementById('imageContainer').style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        grid.appendChild(img);
      });
    }
  </script>
</body>
</html>
