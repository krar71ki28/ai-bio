<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تطور الكرات الذكية 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; overflow: hidden; background: #09090b; font-family: 'Cairo', sans-serif; color: #fff; }
  #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .panel { background: rgba(15, 23, 42, 0.8); padding: 10px 15px; border-radius: 12px; border: 1px solid #38bdf8; font-size: 14px; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .panel b { color: #38bdf8; font-size: 16px; }
  #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
  button { padding: 12px 24px; border-radius: 12px; border: none; font-family: 'Cairo'; font-weight: bold; font-size: 14px; background: #38bdf8; color: #000; cursor: pointer; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); transition: 0.2s; }
  button:active { transform: scale(0.95); }
  button.reset { background: #ef4444; color: #fff; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
</style>
</head>
<body>
  <div id="ui">
    <div class="panel">الجيل: <b id="genText">1</b></div>
    <div class="panel">أفضل مسافة: <b id="fitText">0</b>م</div>
  </div>
  <div id="controls">
    <button id="btnSpeed">⏩ السرعة: x1</button>
    <button class="reset" id="btnReset">🔄 إعادة</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  
  <script>
    // 1. إعداد الرسم
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a); // لون أزرق داكن
    scene.fog = new THREE.FogExp2(0x0f172a, 0.02); // ضباب لإخفاء الحواف

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
    camera.position.set(0, 8, -10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // الإضاءة
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // الأرضية (صلبة + شبكة)
    const groundGeo = new THREE.PlaneGeometry(500, 500);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 1 });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = -0.01;
    scene.add(groundMesh);

    const gridHelper = new THREE.GridHelper(500, 250, 0x38bdf8, 0x334155);
    scene.add(gridHelper);

    // 2. إعداد الفيزياء
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    const groundBody = new CANNON.Body({ mass: 0 });
    groundBody.addShape(new CANNON.Plane());
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    // 3. الشبكة العصبية
    class NeuralNet {
      constructor() { this.w = Array.from({length: 4}, () => Math.random() * 2 - 1); }
      predict(inputs) {
        let out = [0, 0];
        for (let i = 0; i < inputs.length; i++) {
          out[0] += inputs[i] * this.w[i];
          out[1] += inputs[i] * this.w[(i+2)%4];
        }
        return out.map(Math.tanh);
      }
      mutate() { this.w = this.w.map(v => Math.random() < 0.15 ? v + (Math.random()*2-1)*0.5 : v); }
    }

    // 4. الكرة الذكية
    class Agent {
      constructor(brain) {
        this.brain = brain || new NeuralNet();
        
        this.body = new CANNON.Body({ mass: 1, shape: new CANNON.Sphere(0.6) });
        this.body.position.set((Math.random()-0.5)*2, 0.6, 0);
        this.body.linearDamping = 0.1; // تقليل الاحتكاك ليتحرك بسرعة
        this.body.angularDamping = 0.1;
        world.addBody(this.body);
        
        this.mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.6, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0ea5e9, emissiveIntensity: 0.8 })
        );
        scene.add(this.mesh);

        // خط المسار
        const positions = new Float32Array(150 * 3);
        this.trailGeo = new THREE.BufferGeometry();
        this.trailGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        this.trail = new THREE.Line(this.trailGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 }));
        scene.add(this.trail);
        this.trailCount = 0;
        
        this.dead = false;
        this.life = 0;
        this.fitness = 0;
      }
      
      update() {
        if (this.dead) return;
        this.life++;
        
        let pos = this.body.position;
        let vel = this.body.velocity;
        
        // مدخلات الشبكة
        let inputs = [vel.z / 5, vel.x / 5, this.body.angularVelocity.z / 5, 1];
        let out = this.brain.predict(inputs);
        
        // تطبيق القوة للأمام وللجانب
        this.body.velocity.z += out[0] * 0.4;
        this.body.velocity.x += out[1] * 0.2;
        
        this.mesh.position.copy(pos);
        this.mesh.quaternion.copy(this.body.quaternion);
        
        // تحديث المسار
        if (this.life % 3 === 0 && this.trailCount < 150) {
          let arr = this.trailGeo.attributes.position.array;
          arr[this.trailCount*3] = pos.x;
          arr[this.trailCount*3+1] = pos.y;
          arr[this.trailCount*3+2] = pos.z;
          this.trailGeo.attributes.position.needsUpdate = true;
          this.trailGeo.setDrawRange(0, this.trailCount + 1);
          this.trailCount++;
        }
        
        this.fitness = pos.z; // المسافة المقطوعة
        
        // الموت (إذا خرج عن المسار أو انتهى الوقت)
        if (Math.abs(pos.x) > 15 || pos.y < -5 || this.life > 600) {
          this.dead = true;
          this.mesh.visible = false;
          this.trail.visible = false;
        }
      }
    }

    let agents = [];
    let bestBrain = null;
    let bestFitness = 0;
    let gen = 1;
    let speed = 1;
    let leaderPos = {x: 0, y: 0, z: 0};

    function init() {
      agents.forEach(a => { scene.remove(a.mesh); scene.remove(a.trail); world.removeBody(a.body); });
      agents = [];
      for (let i = 0; i < 20; i++) agents.push(new Agent(bestBrain));
      gen = 1;
      document.getElementById('genText').innerText = gen;
      camera.position.set(0, 8, -10);
    }

    function animate() {
      requestAnimationFrame(animate);
      
      for (let s = 0; s < speed; s++) {
        world.step(1/60);
        
        let aliveCount = 0;
        let currentLeader = agents[0];

        for (let i = 0; i < agents.length; i++) {
          agents[i].update();
          if (!agents[i].dead) {
            aliveCount++;
            if (agents[i].fitness > currentLeader.fitness) currentLeader = agents[i];
          }
        }
        
        if (!currentLeader.dead) leaderPos = currentLeader.body.position;

        if (aliveCount === 0) {
          agents.sort((a, b) => b.fitness - a.fitness);
          if (agents[0].fitness > bestFitness) {
            bestFitness = agents[0].fitness;
            bestBrain = agents[0].brain;
          }
          
          let newBrains = [];
          for (let i = 0; i < 20; i++) {
            let b = new NeuralNet();
            b.w = [...bestBrain.w];
            b.mutate();
            newBrains.push(b);
          }
          
          agents.forEach(a => { scene.remove(a.mesh); scene.remove(a.trail); world.removeBody(a.body); });
          agents = [];
          newBrains.forEach(b => agents.push(new Agent(b)));
          
          gen++;
          document.getElementById('genText').innerText = gen;
          document.getElementById('fitText').innerText = bestFitness.toFixed(1);
          camera.position.set(0, 8, -10); // إعادة الكاميرا لنقطة البداية
          break;
        }
      }
      
      // الكاميرا تتبع الزعيم (من الخلف والأعلى)
      if (!agents.every(a => a.dead)) {
        let targetCamX = leaderPos.x;
        let targetCamY = leaderPos.y + 6;
        let targetCamZ = leaderPos.z - 12;
        
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 0.1);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetCamY, 0.1);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, 0.1);
        
        camera.lookAt(leaderPos.x, leaderPos.y, leaderPos.z + 5);
      }
      
      renderer.render(scene, camera);
    }

    document.getElementById('btnSpeed').onclick = (e) => {
      speed = speed === 1 ? 5 : (speed === 5 ? 10 : 1);
      e.target.innerText = '⏩ السرعة: x' + speed;
    };
    document.getElementById('btnReset').onclick = () => { bestBrain = null; bestFitness = 0; init(); };

    init();
    animate();
  </script>
</body>
</html>
