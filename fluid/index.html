<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WebGL Fluid Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: 'Cairo'; color: #fff; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .back-btn { position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); z-index: 10; font-weight: bold; }
  #info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; font-size: 14px; pointer-events: none; border: 1px solid #38bdf8; white-space: nowrap; z-index: 10; }
</style>
</head>
<body>
  <a href="../index.html" class="back-btn">⬅️ القائمة</a>
  <div id="info">مرر إصبعك على الشاشة لصنع تموجات النيون 🌊</div>
  
  <!-- استدعاء مكتبة المحاكاة الجاهزة -->
  <script src="https://cdn.jsdelivr.net/gh/PavelDoGreat/WebGL-Fluid-Simulation/script.js"></script>
  <script>
    // ضبط إعدادات المحاكاة للهواتف
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof config !== 'undefined') {
        config.BLOOM = true; // إضاءة النيون
        config.SUNRAYS = false; // إيقافها لتخفيف الحمل
        config.DENSITY_DISSIPATION = 1.0; 
        config.VELOCITY_DISSIPATION = 0.2;
      }
    });
  </script>
</body>
</html>
