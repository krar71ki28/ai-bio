<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChatGPT المحلي (WebGPU)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #38bdf8; --user: #0ea5e9; --ai: #334155; }
  body { background: var(--bg); color: var(--text); font-family: 'Cairo'; height: 100vh; display: flex; flex-direction: column; margin: 0; }
  .header { padding: 15px; background: var(--card); text-align: center; position: relative; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .header a { color: var(--primary); text-decoration: none; display: inline-block; margin-bottom: 10px; font-weight: bold; }
  .header b { font-size: 16px; }
  #status { font-size: 12px; color: #fbbf24; margin-top: 5px; }
  
  .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--ai); border-bottom-left-radius: 4px; }
  
  .input-area { padding: 15px; background: var(--card); display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
  .input-area input { flex: 1; padding: 12px 16px; border-radius: 24px; border: none; background: rgba(0,0,0,0.2); color: #fff; font-family: 'Cairo'; outline: none; }
  .input-area button { padding: 0 20px; border-radius: 24px; border: none; background: var(--primary); color: #000; font-weight: bold; font-family: 'Cairo'; cursor: pointer; }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="header">
    <a href="index.html">⬅️ القائمة</a>
    <b>🧠 ذكاء اصطناعي متقدم (WebGPU)</b>
    <div id="status">جاري فحص توافق الهاتف...</div>
  </div>
  
  <div class="chat" id="chatBox">
    <div class="msg ai">مرحباً! أنا نموذج Qwen 1.5B. أنا أذكى من النموذج السابق، وأفهم العربية جيداً. سأقوم بتحميل "دماغي" الآن (قد يستغرق بعض الوقت)، وبعدها يمكنك التحدث معي بدون إنترنت.</div>
  </div>
  
  <div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب رسالتك..." disabled>
    <button id="sendBtn" disabled>إرسال</button>
  </div>

  <!-- استدعاء مكتبة WebLLM -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    let engine = null;
    let messages = [{ role: "system", content: "أنت مساعد ذكي ومفيد. أجب باللغة التي يتحدث بها المستخدم." }];

    async function initAI() {
      try {
        // استخدام نموذج Qwen 1.5B (حجم صغير، ذكاء عالي، يدعم العربية)
        const selectedModel = "Qwen2-1.5B-Instruct-q4f16_1-MLC";
        
        status.innerText = `جاري تحميل النموذج (${selectedModel})...`;
        
        // إنشاء المحرك باستخدام WebGPU
        engine = await webllm.CreateMLCEngine(selectedModel, {
          initProgressCallback: (progress) => {
            status.innerText = progress.text;
          }
        });

        status.innerText = "✅ جاهز (يعمل بدون إنترنت)";
        status.style.color = "#10b981";
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      } catch (error) {
        status.innerText = "❌ متصفحك لا يدعم WebGPU أو فشل التحميل.";
        status.style.color = "#ef4444";
        addMessage("عذراً، هذا المتصفح لا يدعم WebGPU اللازم لتشغيل النموذج. جرب استخدام Google Chrome على الأندرويد.", "ai");
      }
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || !engine) return;

      addMessage(text, "user");
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'msg ai';
      loadingDiv.innerText = '... يفكر';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        messages.push({ role: "user", content: text });
        
        // إرسال الطلب للنموذج
        const response = await engine.chat.completions.create({
          messages: messages,
          max_tokens: 512,
          temperature: 0.7
        });

        const reply = response.choices[0].message.content;
        messages.push({ role: "assistant", content: reply });
        
        loadingDiv.remove();
        addMessage(reply, "ai");
      } catch (error) {
        loadingDiv.remove();
        addMessage("حدث خطأ أثناء التفكير: " + error.message, "ai");
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // فحص دعم WebGPU
    if (!navigator.gpu) {
      status.innerText = "⚠️ WebGPU غير مدعوم. يرجى استخدام Chrome حديث.";
      status.style.color = "#fbbf24";
    } else {
      initAI();
    }
  </script>
</body>
</html>
